apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-backend
  namespace: aks-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: aks-backend

  template:
    metadata:
      labels:
        app: aks-backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/thakur-rohit-21/aks-app-backend:v1
          imagePullPolicy: IfNotPresent


          ports:
            - containerPort: 8000

          env:
            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aks-app-secret
                  key: JWT_SECRET

          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10